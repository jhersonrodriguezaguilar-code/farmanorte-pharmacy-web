<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Actualizando FarmaNorte</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; background: #f4f7fc; color: #14212b; }
      main { max-width: 420px; margin: 24px; padding: 28px; border: 1px solid #dce6f3; border-radius: 18px; background: white; text-align: center; box-shadow: 0 18px 48px rgb(20 33 43 / 12%); }
      h1 { margin: 0 0 10px; color: #2151aa; font-size: 22px; }
      p { margin: 0; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Actualizando FarmaNorte</h1>
      <p>Estamos limpiando una versión anterior guardada en este dispositivo.</p>
    </main>
    <script>
      (async () => {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
          }
        } finally {
          window.location.replace('./?build=0.20.4');
        }
      })();
    </script>
  </body>
</html>
